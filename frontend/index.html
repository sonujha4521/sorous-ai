<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070b16"
    >

    <title>Sorous AI</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            color: #ffffff;

            background:
                linear-gradient(
                    rgba(3, 7, 18, 0.68),
                    rgba(3, 7, 18, 0.90)
                ),
                url("./images/background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow: hidden;
        }


        button,
        input,
        textarea {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        /* =========================================================
           LOADING SCREEN
        ========================================================= */

        #loadingScreen {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            gap: 18px;

            background: #050812;

            z-index: 9999;
        }


        .loading-face {
            width: 105px;
            height: 105px;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.15);

            box-shadow:
                0 0 25px rgba(124,58,237,0.9),
                0 0 70px rgba(59,130,246,0.45);

            animation: pulse 2s infinite;
        }


        .loading-title {
            font-size: 24px;
            font-weight: 700;
        }


        .loading-text {
            color: #9ca3af;
            font-size: 14px;
        }


        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }

        }


        /* =========================================================
           AUTH PAGE
        ========================================================= */

        #authPage {
            width: 100%;
            height: 100vh;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .auth-card {
            width: 100%;
            max-width: 460px;

            padding: 42px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 25, 48, 0.96),
                    rgba(5, 10, 24, 0.97)
                );

            border:
                1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.60);
        }


        .auth-face {
            width: 125px;
            height: 125px;

            display: block;

            margin: 0 auto 24px;

            object-fit: cover;

            border-radius: 50%;

            border:
                3px solid rgba(255,255,255,0.12);

            box-shadow:
                0 0 25px rgba(124,58,237,0.85),
                0 0 65px rgba(59,130,246,0.30);
        }


        .auth-title {
            text-align: center;

            font-size: 34px;
            font-weight: 800;

            margin-bottom: 10px;
        }


        .auth-subtitle {
            text-align: center;

            color: #aeb9cc;

            line-height: 1.5;

            font-size: 15px;

            margin-bottom: 30px;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #d8deea;
        }


        .form-input {
            width: 100%;

            height: 52px;

            padding: 0 16px;

            border-radius: 14px;

            border:
                1px solid rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.055);

            color: #ffffff;

            outline: none;

            transition: 0.2s;
        }


        .form-input::placeholder {
            color: #6f7b90;
        }


        .form-input:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139,92,246,0.13);
        }


        #nameGroup {
            display: none;
        }


        /* =========================================================
           AUTH BUTTON
        ========================================================= */

        .auth-button {
            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 14px;

            color: white;

            font-size: 16px;
            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            box-shadow:
                0 10px 30px rgba(124,58,237,0.30);

            transition: 0.2s;
        }


        .auth-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 14px 35px rgba(124,58,237,0.42);
        }


        .auth-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        .auth-error {
            min-height: 20px;

            margin-top: 14px;

            text-align: center;

            color: #f87171;

            font-size: 14px;
        }


        .switch-area {
            margin-top: 24px;

            text-align: center;

            color: #8995aa;

            font-size: 14px;
        }


        .switch-button {
            border: none;

            background: none;

            color: #a78bfa;

            font-weight: 700;

            margin-left: 5px;
        }


        .switch-button:hover {
            text-decoration: underline;
        }


        /* =========================================================
           CHAT PAGE
        ========================================================= */

        #chatPage {
            width: 100%;
            height: 100vh;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 18px;
        }


        .chat-container {
            width: 100%;
            max-width: 1050px;

            height: calc(100vh - 36px);

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border-radius: 25px;

            background:
                rgba(5, 10, 23, 0.90);

            border:
                1px solid rgba(255,255,255,0.11);

            backdrop-filter: blur(18px);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.60);
        }


        /* =========================================================
           CHAT HEADER
        ========================================================= */

        .chat-header {
            min-height: 78px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 12px 18px;

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            background:
                rgba(10,16,32,0.72);
        }


        .chat-brand {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .chat-face {
            width: 48px;
            height: 48px;

            object-fit: cover;

            border-radius: 50%;

            border:
                2px solid rgba(255,255,255,0.12);

            box-shadow:
                0 0 18px rgba(124,58,237,0.60);
        }


        .brand-name {
            font-size: 19px;
            font-weight: 800;
        }


        .brand-status {
            display: flex;

            align-items: center;

            gap: 6px;

            margin-top: 3px;

            color: #7f8ba0;

            font-size: 12px;
        }


        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 8px rgba(34,197,94,0.8);
        }


        .header-actions {
            display: flex;

            align-items: center;

            gap: 8px;
        }


        .user-name {
            color: #b9c3d4;

            font-size: 13px;

            margin-right: 6px;
        }


        .logout-button {
            height: 38px;

            padding: 0 14px;

            border-radius: 10px;

            border:
                1px solid rgba(248,113,113,0.20);

            background:
                rgba(239,68,68,0.08);

            color: #fca5a5;

            font-size: 13px;

            transition: 0.2s;
        }


        .logout-button:hover {
            background:
                rgba(239,68,68,0.16);
        }


        /* =========================================================
           MESSAGES
        ========================================================= */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 26px 22px;

            scroll-behavior: smooth;
        }


        .messages::-webkit-scrollbar {
            width: 7px;
        }


        .messages::-webkit-scrollbar-track {
            background: transparent;
        }


        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);

            border-radius: 20px;
        }


        .message-row {
            display: flex;

            margin-bottom: 18px;

            width: 100%;
        }


        .message-row.user {
            justify-content: flex-end;
        }


        .message-row.assistant {
            justify-content: flex-start;
        }


        .message-inner {
            display: flex;

            align-items: flex-start;

            gap: 10px;

            max-width: 82%;
        }


        .message-row.user .message-inner {
            flex-direction: row-reverse;
        }


        .message-avatar {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            object-fit: cover;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,0.10);
        }


        .user-avatar {
            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-size: 13px;
            font-weight: 700;
        }


        .message-bubble {
            padding: 12px 15px;

            border-radius: 16px;

            white-space: pre-wrap;

            word-break: break-word;

            line-height: 1.55;

            font-size: 15px;
        }


        .message-row.assistant
        .message-bubble {
            background:
                rgba(255,255,255,0.065);

            border:
                1px solid rgba(255,255,255,0.08);

            border-top-left-radius: 5px;

            color: #edf2fa;
        }


        .message-row.user
        .message-bubble {
            background:
                linear-gradient(
                    135deg,
                    #5b21b6,
                    #4338ca
                );

            border:
                1px solid rgba(167,139,250,0.20);

            border-top-right-radius: 5px;

            color: white;
        }


        .message-time {
            margin-top: 5px;

            color: #69758a;

            font-size: 10px;
        }


        .message-row.user
        .message-time {
            text-align: right;
        }


        /* =========================================================
           TYPING
        ========================================================= */

        .typing-bubble {
            display: flex;

            align-items: center;

            gap: 5px;
        }


        .typing-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #a78bfa;

            animation: typing 1.2s infinite;
        }


        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }


        .typing-dot:nth-child(3) {
            animation-delay: 0.30s;
        }


        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }

        }


        /* =========================================================
           INPUT
        ========================================================= */

        .chat-input-area {
            padding: 14px 18px 18px;

            border-top:
                1px solid rgba(255,255,255,0.08);

            background:
                rgba(7,12,25,0.72);
        }


        .input-wrapper {
            display: flex;

            align-items: flex-end;

            gap: 10px;

            padding: 8px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid rgba(255,255,255,0.10);
        }


        #chatInput {
            flex: 1;

            min-height: 42px;
            max-height: 140px;

            resize: none;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            padding: 10px 9px;

            font-size: 15px;

            line-height: 1.45;
        }


        #chatInput::placeholder {
            color: #6e7b91;
        }


        .send-button {
            width: 46px;
            height: 46px;

            flex-shrink: 0;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            color: white;

            font-size: 18px;

            transition: 0.2s;
        }


        .send-button:hover {
            transform: translateY(-1px);
        }


        /* =========================================================
           SPEECH TO TEXT
        ========================================================= */

        .mic-button {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 13px;
            background: rgba(255,255,255,0.055);
            color: #dbe4f5;
            font-size: 19px;
            transition: 0.2s;
        }

        .mic-button:hover {
            transform: translateY(-1px);
            background: rgba(139,92,246,0.16);
        }

        .mic-button.listening {
            background: rgba(239,68,68,0.16);
            border-color: rgba(248,113,113,0.40);
            color: #fca5a5;
            animation: micPulse 1.2s infinite;
        }

        @keyframes micPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(248,113,113,0.20);
            }
            50% {
                box-shadow: 0 0 0 7px rgba(248,113,113,0.04);
            }
        }

        .speech-status {
            min-height: 15px;
            margin-top: 5px;
            text-align: center;
            color: #8b96aa;
            font-size: 10px;
        }


        .send-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }


        .input-hint {
            text-align: center;

            margin-top: 8px;

            color: #5f6b80;

            font-size: 11px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            body {
                background-attachment: scroll;
            }


            #authPage {
                padding: 12px;
            }


            .auth-card {
                padding: 30px 22px;

                border-radius: 22px;
            }


            .auth-face {
                width: 100px;
                height: 100px;
            }


            .auth-title {
                font-size: 28px;
            }


            .auth-subtitle {
                font-size: 14px;
            }


            #chatPage {
                padding: 0;
            }


            .chat-container {
                height: 100vh;

                border-radius: 0;

                border: none;
            }


            .chat-header {
                min-height: 70px;

                padding: 10px 12px;
            }


            .chat-face {
                width: 42px;
                height: 42px;
            }


            .brand-name {
                font-size: 17px;
            }


            .user-name {
                display: none;
            }


            .logout-button {
                padding: 0 10px;
            }


            .messages {
                padding: 18px 12px;
            }


            .message-inner {
                max-width: 92%;
            }


            .message-bubble {
                font-size: 14px;

                padding: 10px 12px;
            }


            .chat-input-area {
                padding: 10px;
            }

        }


        /* =========================================================
           SMALL MOBILE
        ========================================================= */

        @media (max-width: 420px) {

            .auth-card {
                padding: 25px 17px;
            }


            .auth-title {
                font-size: 25px;
            }


            .message-avatar {
                width: 30px;
                height: 30px;
            }


            .message-inner {
                gap: 7px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================================
         LOADING
    ========================================================= -->

    <div id="loadingScreen">

        <img
            src="./images/sorous-face.png"
            class="loading-face"
            alt="Sorous"
        >

        <div class="loading-title">
            Sorous AI
        </div>

        <div class="loading-text">
            Starting your AI assistant...
        </div>

    </div>



    <!-- =========================================================
         AUTH PAGE
    ========================================================= -->

    <section id="authPage">

        <div class="auth-card">

            <img
                src="./images/sorous-face.png"
                class="auth-face"
                alt="Sorous AI"
            >


            <h1
                class="auth-title"
                id="authTitle"
            >
                Welcome to Sorous
            </h1>


            <p
                class="auth-subtitle"
                id="authSubtitle"
            >
                Login to continue your journey with Sorous AI
            </p>


            <!-- NAME -->

            <div
                class="form-group"
                id="nameGroup"
            >

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    class="form-input"
                    placeholder="Enter your name"
                    autocomplete="name"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <button
                id="authButton"
                class="auth-button"
                onclick="handleAuth()"
            >
                Login
            </button>


            <div
                id="authError"
                class="auth-error"
            ></div>


            <div class="switch-area">

                <span id="switchText">
                    Don't have an account?
                </span>

                <button
                    class="switch-button"
                    id="switchButton"
                    onclick="toggleAuthMode()"
                >
                    Create Account
                </button>

            </div>

        </div>

    </section>



    <!-- =========================================================
         CHAT PAGE
    ========================================================= -->

    <section id="chatPage">

        <div class="chat-container">


            <!-- HEADER -->

            <header class="chat-header">

                <div class="chat-brand">

                    <img
                        src="./images/sorous-face.png"
                        class="chat-face"
                        alt="Sorous"
                    >

                    <div>

                        <div class="brand-name">
                            Sorous AI
                        </div>

                        <div class="brand-status">

                            <span class="status-dot"></span>

                            Online

                        </div>

                    </div>

                </div>


                <div class="header-actions">

                    <span
                        id="userName"
                        class="user-name"
                    >
                        User
                    </span>

                    <button
                        class="logout-button"
                        onclick="logout()"
                    >
                        Logout
                    </button>

                </div>

            </header>



            <!-- MESSAGES -->

            <main
                id="messages"
                class="messages"
            ></main>



            <!-- INPUT -->

            <div class="chat-input-area">

                <div class="input-wrapper">

                    <textarea
                        id="chatInput"
                        rows="1"
                        placeholder="Message Sorous..."
                        maxlength="5000"
                    ></textarea>


                    <button
                        id="micButton"
                        class="mic-button"
                        type="button"
                        onclick="toggleSpeechRecognition()"
                        aria-label="Voice input"
                        title="Voice input"
                    >
                        🎙️
                    </button>


                    <button
                        id="sendButton"
                        class="send-button"
                        onclick="sendMessage()"
                        aria-label="Send message"
                    >
                        ➤
                    </button>

                </div>


                <div
                    id="speechStatus"
                    class="speech-status"
                    aria-live="polite"
                ></div>


                <div class="input-hint">
                    Enter to send • Shift + Enter for new line
                </div>

            </div>

        </div>

    </section>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>


        /* =========================================================
           API CONFIG
        ========================================================= */

        const LOCAL_API =
            "http://127.0.0.1:8000";

        const PRODUCTION_API =
            "https://sorous-ai.onrender.com";


        /*
            Localhost par local backend use hoga.
            Netlify/live website par Render backend use hoga.
        */

        const API_BASE =
            (
                window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1"
            )
                ? LOCAL_API
                : PRODUCTION_API;


        /* =========================================================
           STATE
        ========================================================= */

        let authMode = "login";

        let authToken =
            localStorage.getItem("sorous_token");

        let currentUser = null;


        /* =========================================================
           DOM
        ========================================================= */

        const loadingScreen =
            document.getElementById("loadingScreen");

        const authPage =
            document.getElementById("authPage");

        const chatPage =
            document.getElementById("chatPage");

        const messagesBox =
            document.getElementById("messages");

        const chatInput =
            document.getElementById("chatInput");

        const sendButton =
            document.getElementById("sendButton");

        const micButton =
            document.getElementById("micButton");

        const speechStatus =
            document.getElementById("speechStatus");


        /* =========================================================
           SPEECH TO TEXT
        ========================================================= */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let speechRecognition = null;
        let isListening = false;
        let speechBaseText = "";

        if (SpeechRecognition) {

            speechRecognition =
                new SpeechRecognition();

            speechRecognition.lang = "hi-IN";
            speechRecognition.continuous = false;
            speechRecognition.interimResults = true;
            speechRecognition.maxAlternatives = 1;

            speechRecognition.onstart = function () {
                isListening = true;
                micButton.classList.add("listening");
                micButton.textContent = "⏹️";
                speechStatus.textContent =
                    "Sun raha hoon... boliye 🎙️";
            };

            speechRecognition.onresult = function (event) {
                let finalText = "";
                let interimText = "";

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        finalText += text;
                    } else {
                        interimText += text;
                    }
                }

                const combined =
                    (speechBaseText + " " + finalText).trim();

                chatInput.value =
                    (combined + (interimText ? " " + interimText : "")).trim();

                autoResize();
            };

            speechRecognition.onerror = function (event) {
                console.error("Speech recognition error:", event.error);

                if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                    speechStatus.textContent =
                        "Microphone permission allow karo.";
                } else if (event.error === "no-speech") {
                    speechStatus.textContent =
                        "Awaaz nahi mili, dobara try karo.";
                } else {
                    speechStatus.textContent =
                        "Voice input error. Dobara try karo.";
                }
            };

            speechRecognition.onend = function () {
                isListening = false;
                micButton.classList.remove("listening");
                micButton.textContent = "🎙️";

                setTimeout(function () {
                    if (!isListening) {
                        speechStatus.textContent = "";
                    }
                }, 1800);
            };

        } else {

            micButton.disabled = true;
            micButton.title =
                "Speech-to-text is not supported in this browser";
            speechStatus.textContent =
                "Voice input is not supported in this browser.";
        }


        function toggleSpeechRecognition() {

            if (!speechRecognition) {
                return;
            }

            if (isListening) {
                speechRecognition.stop();
                return;
            }

            speechBaseText = chatInput.value.trim();

            try {
                speechRecognition.start();
            } catch (error) {
                console.error("Speech start error:", error);
            }
        }


        /* =========================================================
           SAFE JSON
        ========================================================= */

        async function readResponse(response) {

            const text =
                await response.text();

            if (!text) {
                return {};
            }

            try {
                return JSON.parse(text);
            }

            catch {
                return {
                    detail: text
                };
            }

        }


        /* =========================================================
           PAGE LOAD
        ========================================================= */

        window.addEventListener(
            "load",
            async function () {

                setTimeout(
                    async function () {

                        loadingScreen.style.display =
                            "none";


                        if (authToken) {

                            const valid =
                                await validateSession();

                            if (valid) {

                                openChat();

                            }

                            else {

                                clearSession();

                                showAuth();

                            }

                        }

                        else {

                            showAuth();

                        }

                    },
                    700
                );

            }
        );


        /* =========================================================
           SHOW AUTH
        ========================================================= */

        function showAuth() {

            authPage.style.display =
                "flex";

            chatPage.style.display =
                "none";

        }


        /* =========================================================
           TOGGLE LOGIN / REGISTER
        ========================================================= */

        function toggleAuthMode() {

            const nameGroup =
                document.getElementById(
                    "nameGroup"
                );

            const title =
                document.getElementById(
                    "authTitle"
                );

            const subtitle =
                document.getElementById(
                    "authSubtitle"
                );

            const button =
                document.getElementById(
                    "authButton"
                );

            const switchText =
                document.getElementById(
                    "switchText"
                );

            const switchButton =
                document.getElementById(
                    "switchButton"
                );

            const error =
                document.getElementById(
                    "authError"
                );


            error.textContent = "";


            if (authMode === "login") {

                authMode = "register";


                nameGroup.style.display =
                    "block";


                title.textContent =
                    "Create Your Account";


                subtitle.textContent =
                    "Create your Sorous AI account and save your chats";


                button.textContent =
                    "Create Account";


                switchText.textContent =
                    "Already have an account?";


                switchButton.textContent =
                    "Login";

            }

            else {

                authMode = "login";


                nameGroup.style.display =
                    "none";


                title.textContent =
                    "Welcome to Sorous";


                subtitle.textContent =
                    "Login to continue your journey with Sorous AI";


                button.textContent =
                    "Login";


                switchText.textContent =
                    "Don't have an account?";


                switchButton.textContent =
                    "Create Account";

            }

        }


        /* =========================================================
           LOGIN / REGISTER
        ========================================================= */

        async function handleAuth() {

            const nameInput =
                document.getElementById(
                    "name"
                );

            const emailInput =
                document.getElementById(
                    "email"
                );

            const passwordInput =
                document.getElementById(
                    "password"
                );

            const button =
                document.getElementById(
                    "authButton"
                );

            const errorBox =
                document.getElementById(
                    "authError"
                );


            const name =
                nameInput.value.trim();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            errorBox.textContent = "";


            /* VALIDATION */

            if (!email) {

                errorBox.textContent =
                    "Email enter karo.";

                return;

            }


            if (!password) {

                errorBox.textContent =
                    "Password enter karo.";

                return;

            }


            if (
                authMode === "register" &&
                !name
            ) {

                errorBox.textContent =
                    "Name enter karo.";

                return;

            }


            if (
                authMode === "register" &&
                password.length < 6
            ) {

                errorBox.textContent =
                    "Password minimum 6 characters ka hona chahiye.";

                return;

            }


            const endpoint =
                authMode === "login"
                    ? "/api/login"
                    : "/api/register";


            const payload =
                authMode === "login"
                    ? {
                        email: email,
                        password: password
                    }
                    : {
                        name: name,
                        email: email,
                        password: password
                    };


            const oldText =
                button.textContent;


            button.disabled =
                true;


            button.textContent =
                authMode === "login"
                    ? "Logging in..."
                    : "Creating account...";


            try {

                const response =
                    await fetch(
                        API_BASE + endpoint,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );


                const data =
                    await readResponse(
                        response
                    );


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Authentication failed"
                    );

                }


                if (!data.token) {

                    throw new Error(
                        "Backend ne login token return nahi kiya."
                    );

                }


                authToken =
                    data.token;


                currentUser =
                    data.user || null;


                localStorage.setItem(
                    "sorous_token",
                    authToken
                );


                localStorage.setItem(
                    "sorous_user",
                    JSON.stringify(
                        currentUser
                    )
                );


                nameInput.value = "";
                emailInput.value = "";
                passwordInput.value = "";


                openChat();

            }

            catch (error) {

                console.error(
                    "Authentication error:",
                    error
                );


                errorBox.textContent =
                    getFriendlyError(
                        error
                    );

            }

            finally {

                button.disabled =
                    false;

                button.textContent =
                    oldText;

            }

        }


        /* =========================================================
           SESSION VALIDATION
        ========================================================= */

        async function validateSession() {

            try {

                const response =
                    await fetch(
                        API_BASE + "/api/history",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    token:
                                        authToken
                                })
                        }
                    );


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    return false;

                }


                if (!response.ok) {

                    /*
                        Temporary server problem par
                        existing login ko immediately
                        destroy nahi karenge.
                    */

                    return true;

                }


                const userData =
                    localStorage.getItem(
                        "sorous_user"
                    );


                if (userData) {

                    try {

                        currentUser =
                            JSON.parse(
                                userData
                            );

                    }

                    catch {

                        currentUser =
                            null;

                    }

                }


                return true;

            }

            catch (error) {

                console.error(
                    "Session validation error:",
                    error
                );

                return true;

            }

        }


        /* =========================================================
           OPEN CHAT
        ========================================================= */

        async function openChat() {

            authPage.style.display =
                "none";


            chatPage.style.display =
                "flex";


            updateUserName();


            await loadHistory();


            chatInput.focus();

        }


        /* =========================================================
           UPDATE USER NAME
        ========================================================= */

        function updateUserName() {

            const userName =
                document.getElementById(
                    "userName"
                );


            if (
                currentUser &&
                currentUser.name
            ) {

                userName.textContent =
                    currentUser.name;

            }

            else {

                userName.textContent =
                    "User";

            }

        }


        /* =========================================================
           LOAD CHAT HISTORY
        ========================================================= */

        async function loadHistory() {

            messagesBox.innerHTML =
                "";


            if (!authToken) {

                showWelcomeMessage();

                return;

            }


            try {

                const response =
                    await fetch(
                        API_BASE + "/api/history",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    token:
                                        authToken
                                })
                        }
                    );


                const data =
                    await readResponse(
                        response
                    );


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    clearSession();

                    showAuth();

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "History load failed"
                    );

                }


                if (
                    data.messages &&
                    data.messages.length > 0
                ) {

                    data.messages.forEach(
                        function (message) {

                            addMessage(
                                message.content,
                                message.role
                            );

                        }
                    );

                }

                else {

                    showWelcomeMessage();

                }

            }

            catch (error) {

                console.error(
                    "History error:",
                    error
                );


                showWelcomeMessage();

            }

        }


        /* =========================================================
           WELCOME
        ========================================================= */

        function showWelcomeMessage() {

            const name =
                currentUser &&
                currentUser.name
                    ? currentUser.name
                    : "there";


            addMessage(
                `Hello ${name}! 👋\n\n` +
                "Main Sorous AI hoon. 🤖\n" +
                "Aaj main tumhari kis tarah help kar sakta hoon?",
                "assistant"
            );

        }


        /* =========================================================
           ADD MESSAGE
        ========================================================= */

        function addMessage(
            content,
            role
        ) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    role === "user"
                        ? "user"
                        : "assistant"
                );


            const inner =
                document.createElement(
                    "div"
                );


            inner.className =
                "message-inner";


            /* AVATAR */

            if (role === "user") {

                const avatar =
                    document.createElement(
                        "div"
                    );


                avatar.className =
                    "message-avatar user-avatar";


                const name =
                    currentUser &&
                    currentUser.name
                        ? currentUser.name
                        : "U";


                avatar.textContent =
                    name
                        .charAt(0)
                        .toUpperCase();


                inner.appendChild(
                    avatar
                );

            }

            else {

                const avatar =
                    document.createElement(
                        "img"
                    );


                avatar.className =
                    "message-avatar";


                avatar.src =
                    "./images/sorous-face.png";


                avatar.alt =
                    "Sorous";


                inner.appendChild(
                    avatar
                );

            }


            /* CONTENT */

            const contentWrapper =
                document.createElement(
                    "div"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message-bubble";


            bubble.textContent =
                content || "";


            const time =
                document.createElement(
                    "div"
                );


            time.className =
                "message-time";


            time.textContent =
                getTime();


            contentWrapper.appendChild(
                bubble
            );


            contentWrapper.appendChild(
                time
            );


            inner.appendChild(
                contentWrapper
            );


            row.appendChild(
                inner
            );


            messagesBox.appendChild(
                row
            );


            scrollToBottom();

        }


        /* =========================================================
           TIME
        ========================================================= */

        function getTime() {

            return new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }


        /* =========================================================
           TYPING MESSAGE
        ========================================================= */

        function showTyping() {

            removeTyping();


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row assistant";


            row.id =
                "typingMessage";


            const inner =
                document.createElement(
                    "div"
                );


            inner.className =
                "message-inner";


            const avatar =
                document.createElement(
                    "img"
                );


            avatar.className =
                "message-avatar";


            avatar.src =
                "./images/sorous-face.png";


            avatar.alt =
                "Sorous";


            const content =
                document.createElement(
                    "div"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message-bubble typing-bubble";


            bubble.innerHTML =
                `
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                `;


            content.appendChild(
                bubble
            );


            inner.appendChild(
                avatar
            );


            inner.appendChild(
                content
            );


            row.appendChild(
                inner
            );


            messagesBox.appendChild(
                row
            );


            scrollToBottom();

        }


        /* =========================================================
           REMOVE TYPING
        ========================================================= */

        function removeTyping() {

            const typing =
                document.getElementById(
                    "typingMessage"
                );


            if (typing) {

                typing.remove();

            }

        }


        /* =========================================================
           SEND MESSAGE
        ========================================================= */

        async function sendMessage() {

            const message =
                chatInput.value.trim();


            if (!message) {
                return;
            }


            if (!authToken) {

                showAuth();

                return;

            }


            addMessage(
                message,
                "user"
            );


            chatInput.value = "";


            autoResize();


            sendButton.disabled =
                true;


            showTyping();


            try {

                const response =
                    await fetch(
                        API_BASE + "/api/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    message:
                                        message,

                                    token:
                                        authToken
                                })
                        }
                    );


                const data =
                    await readResponse(
                        response
                    );


                removeTyping();


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    clearSession();

                    showAuth();

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "AI server error"
                    );

                }


                addMessage(
                    data.response ||
                    "Sorous ne koi response nahi diya.",
                    "assistant"
                );

            }

            catch (error) {

                console.error(
                    "Chat error:",
                    error
                );


                removeTyping();


                addMessage(
                    getFriendlyError(
                        error
                    ),
                    "assistant"
                );

            }

            finally {

                sendButton.disabled =
                    false;


                chatInput.focus();

            }

        }


        /* =========================================================
           ENTER TO SEND
        ========================================================= */

        chatInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /* =========================================================
           AUTO RESIZE TEXTAREA
        ========================================================= */

        chatInput.addEventListener(
            "input",
            autoResize
        );


        function autoResize() {

            chatInput.style.height =
                "auto";


            chatInput.style.height =
                Math.min(
                    chatInput.scrollHeight,
                    140
                ) + "px";

        }


        /* =========================================================
           SCROLL
        ========================================================= */

        function scrollToBottom() {

            setTimeout(
                function () {

                    messagesBox.scrollTop =
                        messagesBox.scrollHeight;

                },
                20
            );

        }


        /* =========================================================
           LOGOUT
        ========================================================= */

        async function logout() {

            const token =
                authToken;


            /*
                Backend logout endpoint token
                body mein expect karta hai.
            */

            if (token) {

                try {

                    await fetch(
                        API_BASE + "/api/logout",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    token:
                                        token
                                })
                        }
                    );

                }

                catch (error) {

                    console.log(
                        "Logout request error:",
                        error
                    );

                }

            }


            clearSession();


            messagesBox.innerHTML =
                "";


            showAuth();


            document.getElementById(
                "password"
            ).value = "";

        }


        /* =========================================================
           CLEAR SESSION
        ========================================================= */

        function clearSession() {

            authToken =
                null;


            currentUser =
                null;


            localStorage.removeItem(
                "sorous_token"
            );


            localStorage.removeItem(
                "sorous_user"
            );

        }


        /* =========================================================
           FRIENDLY ERRORS
        ========================================================= */

        function getFriendlyError(
            error
        ) {

            const message =
                error &&
                error.message
                    ? error.message
                    : "";


            if (
                message.includes(
                    "Failed to fetch"
                )
            ) {

                return (
                    "Sorous server se connection nahi ho pa raha. " +
                    "Backend/CORS check karo."
                );

            }


            return (
                "Sorous AI error: " +
                (
                    message ||
                    "Something went wrong."
                )
            );

        }


    </script>

</body>
</html>
